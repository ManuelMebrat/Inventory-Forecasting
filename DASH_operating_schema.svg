<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title description">
  <title id="title">DASH Dog Food operating data model</title>
  <desc id="description">Entity relationship diagram for dog profiles, subscriptions, products, orders, inventory, procurement, recipes, and fulfillment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .background { fill: #f8fafc; }
      .title { font: 600 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-label { font: 12px Arial, sans-serif; fill: #475569; }
      .node-title { font: 600 15px Arial, sans-serif; fill: #0f172a; }
      .node-field { font: 12px Arial, sans-serif; fill: #334155; }
      .node { stroke: #cbd5e1; stroke-width: 1.25; rx: 8; }
      .profile { fill: #dbeafe; }
      .master { fill: #e2e8f0; }
      .commercial { fill: #dcfce7; }
      .subscription { fill: #f3e8ff; }
      .inventory { fill: #ffedd5; }
      .procurement { fill: #fef9c3; }
      .production { fill: #ccfbf1; }
      .fulfillment { fill: #fee2e2; }
      .legend { font: 12px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="background" width="1000" height="660"/>
  <text x="40" y="38" class="title">DASH Dog Food — Operating Data Model</text>
  <text x="40" y="62" class="subtitle">Target schema for subscription, demand, inventory, procurement, production, and fulfillment analysis</text>

  <path class="edge" d="M320 132 C340 132 345 122 365 122"/>
  <text x="327" y="116" class="edge-label">dog plan</text>
  <path class="edge" d="M620 122 C640 122 650 108 680 108"/>
  <text x="625" y="105" class="edge-label">events</text>
  <path class="edge" d="M320 150 C345 170 342 303 365 320"/>
  <text x="325" y="245" class="edge-label">order attribution</text>
  <path class="edge" d="M320 340 C340 340 345 340 365 340"/>
  <text x="326" y="327" class="edge-label">sold as</text>
  <path class="edge" d="M565 360 C620 365 635 365 680 365"/>
  <text x="588" y="350" class="edge-label">fulfilled by</text>
  <path class="edge" d="M180 410 C215 450 300 490 365 515"/>
  <text x="235" y="465" class="edge-label">inventory by SKU</text>
  <path class="edge" d="M180 410 C175 445 165 470 165 510"/>
  <text x="64" y="460" class="edge-label">finished SKU BOM</text>
  <path class="edge" d="M680 550 C600 550 550 550 320 550"/>
  <text x="485" y="538" class="edge-label">supplies materials</text>

  <g transform="translate(50 90)">
    <rect class="node profile" width="270" height="120"/>
    <text x="16" y="28" class="node-title">Dog Profile</text>
    <text x="16" y="53" class="node-field">PK  dog_id + profile_updated_at</text>
    <text x="16" y="73" class="node-field">customer_id · weight_lb · activity_level</text>
    <text x="16" y="93" class="node-field">allergy_ingredients · health_issue_flag</text>
  </g>
  <g transform="translate(365 80)">
    <rect class="node subscription" width="255" height="125"/>
    <text x="16" y="28" class="node-title">Subscription</text>
    <text x="16" y="53" class="node-field">PK  subscription_id</text>
    <text x="16" y="73" class="node-field">dog_id · status · next_charge_at</text>
    <text x="16" y="93" class="node-field">delivery_frequency_days · box_size</text>
  </g>
  <g transform="translate(680 80)">
    <rect class="node subscription" width="270" height="110"/>
    <text x="16" y="28" class="node-title">Subscription Event</text>
    <text x="16" y="53" class="node-field">PK  event_id</text>
    <text x="16" y="73" class="node-field">subscription_id · event_type · event_at</text>
  </g>

  <g transform="translate(50 300)">
    <rect class="node master" width="270" height="125"/>
    <text x="16" y="28" class="node-title">Product Variant</text>
    <text x="16" y="53" class="node-field">PK  sku</text>
    <text x="16" y="73" class="node-field">product_type · recipe_or_protein</text>
    <text x="16" y="93" class="node-field">standard_price · standard_cost</text>
  </g>
  <g transform="translate(365 285)">
    <rect class="node commercial" width="200" height="130"/>
    <text x="16" y="28" class="node-title">Order Line</text>
    <text x="16" y="53" class="node-field">PK  order_id + line_id</text>
    <text x="16" y="73" class="node-field">sku · quantity · net_sales</text>
    <text x="16" y="93" class="node-field">financial + fulfillment status</text>
  </g>
  <g transform="translate(680 295)">
    <rect class="node fulfillment" width="270" height="120"/>
    <text x="16" y="28" class="node-title">Fulfillment Shipment</text>
    <text x="16" y="53" class="node-field">PK  shipment_id</text>
    <text x="16" y="73" class="node-field">order_id · carrier · shipped_at</text>
    <text x="16" y="93" class="node-field">freight_cost · shipment_status</text>
  </g>

  <g transform="translate(365 465)">
    <rect class="node inventory" width="255" height="120"/>
    <text x="16" y="28" class="node-title">Inventory Snapshot</text>
    <text x="16" y="53" class="node-field">PK  snapshot_at + sku + location_id</text>
    <text x="16" y="73" class="node-field">on_hand · available · committed</text>
    <text x="16" y="93" class="node-field">incoming · lot_id · expiry_date</text>
  </g>
  <g transform="translate(50 505)">
    <rect class="node production" width="270" height="105"/>
    <text x="16" y="28" class="node-title">BOM / Recipe</text>
    <text x="16" y="53" class="node-field">PK  finished_sku + material_id</text>
    <text x="16" y="73" class="node-field">qty_per_finished_unit · yield_rate</text>
  </g>
  <g transform="translate(680 495)">
    <rect class="node procurement" width="270" height="120"/>
    <text x="16" y="28" class="node-title">Purchase Order Line</text>
    <text x="16" y="53" class="node-field">PK  po_id + po_line_id</text>
    <text x="16" y="73" class="node-field">supplier_id · sku_or_material_id</text>
    <text x="16" y="93" class="node-field">ordered_qty · received_qty · unit_cost</text>
  </g>

  <rect x="40" y="630" width="14" height="14" class="profile"/><text x="60" y="642" class="legend">Profile</text>
  <rect x="125" y="630" width="14" height="14" class="commercial"/><text x="145" y="642" class="legend">Commercial</text>
  <rect x="240" y="630" width="14" height="14" class="subscription"/><text x="260" y="642" class="legend">Subscription</text>
  <rect x="360" y="630" width="14" height="14" class="inventory"/><text x="380" y="642" class="legend">Inventory</text>
  <rect x="460" y="630" width="14" height="14" class="production"/><text x="480" y="642" class="legend">Production</text>
  <rect x="575" y="630" width="14" height="14" class="procurement"/><text x="595" y="642" class="legend">Procurement</text>
  <rect x="700" y="630" width="14" height="14" class="fulfillment"/><text x="720" y="642" class="legend">Fulfillment</text>
</svg>
